name = "agro-gestao"
main = "src/worker.js"
account_id = "3d6f9032d96936e1c8c8c96a02373733"
compatibility_date = "2026-09-01"

# Allowed browser origins for the publishing API: the Android app (Capacitor serves from https://localhost)
# and the local dev server.
[vars]
APP_ORIGINS = "https://localhost,http://localhost:5173,http://localhost:5174"

# Create with: npx wrangler kv namespace create PORTFOLIOS — then paste the id below.
[[kv_namespaces]]
binding = "PORTFOLIOS"
id = "3ec2ae7ef3bf4abdba0fe941ca1c9d9b"

# Encrypted automatic backups (ciphertext only). Create with: npx wrangler kv namespace create BACKUPS
[[kv_namespaces]]
binding = "BACKUPS"
id = "197924e88f61493f9e670718ccb5ee02"
