apply plugin: 'com.android.application'

// Public Firebase app configuration is supplied locally, never a Gemini secret or service account.
def educationFile = file('firebase-local/general-education.json')
def educationConfig = educationFile.exists() ? new groovy.json.JsonSlurper().parse(educationFile) : [:]

// The test identity may only be signed with the preserved, externally supplied key.
def buildingCodexIa = gradle.startParameter.taskNames.any { it.toLowerCase().contains('codextesteia') }
def codexSigningPath = project.findProperty(buildingCodexIa ? 'codexIaSigningFile' : 'codexSigningFile')
def buildingCodexTest = gradle.startParameter.taskNames.any { it.toLowerCase().contains('codexteste') }
if (buildingCodexTest && !codexSigningPath) throw new GradleException('Assinatura original do Codex Teste ausente; nenhuma chave nova será gerada.')
if (codexSigningPath && !buildingCodexTest) throw new GradleException('A chave do teste só pode assinar a variante CodexTeste.')
if (buildingCodexTest && codexSigningPath) {
    def store = java.security.KeyStore.getInstance('PKCS12')
    file(codexSigningPath).withInputStream { store.load(it, System.getenv('AGRO_SIGNING_STORE_PASSWORD').toCharArray()) }
    def certificate = store.getCertificate(System.getenv('AGRO_SIGNING_KEY_ALIAS'))
    def digest = java.security.MessageDigest.getInstance('SHA-256').digest(certificate.encoded).encodeHex().toString()
    def expected = buildingCodexIa ? 'b1b8f2c74ebbb75adb5de6abfca5f740bfbf9c3d2b02a0ce8479338e45670c86' : '2fb95cc1aa0aaf55ae607941e666099b81be35196f4dbbda6d99d45fd1346ef0'
    if (digest != expected) throw new GradleException('O certificado não corresponde à variante selecionada.')
}
android {
    if (project.findProject(':qwenmodel') != null) assetPacks = [':qwenmodel']
    namespace = "br.com.territorio.gestao"
    testBuildType "release"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "br.com.territorio.gestao2"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 186
        versionName "0.12.144"
        resValue 'string', 'agro_education_api_key', educationConfig.apiKey ?: ''
        resValue 'string', 'agro_education_app_id', educationConfig.applicationId ?: ''
        resValue 'string', 'agro_education_project_id', educationConfig.projectId ?: ''
        resValue 'string', 'agro_education_sender_id', educationConfig.senderId ?: ''
        // Physical Android phones: retain 32/64-bit ARM; omit unused emulator binaries.
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:voice'
        }
    }
    sourceSets { main { java.exclude '**/AgroVoicePlugin.java'; assets.exclude 'voice/**' }; androidTest { java.exclude '**/VoiceOfflineInstrumentedTest.java' } }
    if (codexSigningPath) {
        signingConfigs.debug.storeFile = file(codexSigningPath)
        signingConfigs.debug.storePassword = System.getenv('AGRO_SIGNING_STORE_PASSWORD')
        signingConfigs.debug.keyAlias = System.getenv('AGRO_SIGNING_KEY_ALIAS')
        signingConfigs.debug.keyPassword = System.getenv('AGRO_SIGNING_KEY_PASSWORD')
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    flavorDimensions "edition"
    productFlavors {
        original { dimension "edition" }
        codexTesteIa {
            dimension "edition"
            minSdkVersion 26 // Official ML Kit Prompt API floor; essential 143 APK is preserved.
            applicationIdSuffix ".codextesteia"
            versionNameSuffix "-teste.1"
            ndk { abiFilters.clear(); abiFilters 'arm64-v8a' }
        }
        codexTeste {
            dimension "edition"
            applicationIdSuffix ".codexteste"
            versionNameSuffix "-teste.1"
            ndk { abiFilters.clear(); abiFilters 'arm64-v8a' }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    codexTesteIaImplementation 'com.google.mlkit:genai-prompt:1.0.0-beta4'
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.18.1'
    implementation platform('com.google.firebase:firebase-bom:35.0.2')
    implementation 'com.google.firebase:firebase-ai'
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    implementation 'com.google.guava:guava:33.4.8-android'
    implementation 'androidx.work:work-runtime:2.11.2'


    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

if (project.findProject(':qwenmodel') != null) {
    tasks.named('preBuild').configure { dependsOn ':qwenmodel:verifyQwenModel' }
}
